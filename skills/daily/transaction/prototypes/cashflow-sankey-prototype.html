<!doctype html>
<!-- THROWAWAY PROTOTYPE — Question: which cashflow Sankey dashboard layout is easiest to scan? Verdict: C selected 2026-08-29 — Sankey plus largest-moves journal. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cashflow Sankey — Prototype</title>
  <style>
    :root { --ink:#172018; --muted:#69736b; --paper:#f6f7f2; --line:#dfe4d9; --green:#397a57; --mint:#cbe8d2; --coral:#e2826d; --peach:#f6d2c5; --purple:#7659a6; --lav:#e5dcf5; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    .page { max-width:1180px; margin:auto; padding:44px 28px 110px; } .eyebrow { color:var(--green); font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:11px; } h1 { margin:6px 0 4px; font-size:32px; letter-spacing:-.04em } .sub { color:var(--muted); margin:0 0 24px } .pill { display:inline-flex; padding:5px 10px; border-radius:20px; background:#e8ece4; color:#536050; font-size:12px; font-weight:700; }
    .metric { background:white; border:1px solid var(--line); border-radius:16px; padding:17px; } .metric small { display:block; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:10px } .metric strong { display:block; margin-top:4px; font-size:24px; letter-spacing:-.04em } .positive { color:var(--green) } .negative { color:#b15343 }
    .sankey { width:100%; height:auto; min-height:330px; display:block; } .sankey text { font-family:Inter,ui-sans-serif,system-ui,sans-serif; fill:var(--ink) } .sankey .label { font-size:13px; font-weight:750 } .sankey .amount { font-size:11px; fill:var(--muted) } .sankey .node { rx:7 } .sankey .flow { fill:none; stroke-linecap:round; opacity:.75 } .key { display:flex; gap:16px; color:var(--muted); font-size:12px; margin-top:13px } .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px }
    .switcher { position:fixed; z-index:2; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:9px 11px; border:1px solid #30372e; border-radius:999px; color:white; background:#20271f; box-shadow:0 10px 30px #15201045; } .switcher button { width:31px; height:31px; border:0; border-radius:50%; background:#364036; color:white; font-size:19px; cursor:pointer } .switcher span { min-width:165px; text-align:center; font-size:12px; font-weight:800 }
    .state { margin-top:18px; padding:11px 13px; background:#e8ece4; border-radius:10px; color:#465046; font:12px/1.35 ui-monospace,SFMono-Regular,monospace }
    /* A — an executive snapshot: metrics first, one broad flow below */ .a-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 } .a-chart { background:white; border:1px solid var(--line); border-radius:20px; padding:22px; }
    /* B — each dollar has a route: cash sits between source and destinations */ .b-layout { display:grid; grid-template-columns:250px 1fr; gap:18px; margin-top:24px } .sidebar { padding:21px; background:#203128; border-radius:20px; color:white } .sidebar h2 { margin:6px 0 17px; font-size:21px; letter-spacing:-.03em } .budget { margin:12px 0; padding:12px 0; border-bottom:1px solid #ffffff2d } .budget b { display:block; font-size:19px } .b-chart { background:white; border:1px solid var(--line); border-radius:20px; padding:22px; }
    /* C — a compact phone-like journal: flow is the hero, monthly totals are secondary */ .c-top { display:flex; justify-content:space-between; align-items:end; margin:22px 0 14px } .c-top strong { font-size:38px; letter-spacing:-.06em } .c-board { display:grid; grid-template-columns:1fr 290px; overflow:hidden; border-radius:20px; border:1px solid var(--line); background:white } .c-chart { padding:20px; border-right:1px solid var(--line) } .feed { padding:19px } .feed h3 { margin:0 0 14px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em } .feed div { padding:11px 0; border-bottom:1px solid #edf0ea; display:flex; justify-content:space-between; gap:12px } .feed small { color:var(--muted); display:block }
    @media (max-width:720px) { .page{padding:28px 16px 110px} .a-metrics{grid-template-columns:repeat(2,1fr)} .b-layout,.c-board{grid-template-columns:1fr}.c-chart{border-right:0;border-bottom:1px solid var(--line)} .sankey{min-width:560px}.a-chart,.b-chart,.c-chart{overflow:auto} }
  </style>
</head>
<body>
  <main class="page" id="app"></main>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const variants = [
      ['A','Executive snapshot'], ['B','Cash account view'], ['C','Flow journal']
    ];
    const money = n => '฿' + n.toLocaleString('en-US');
    const chart = (dense=false) => `<svg class="sankey" viewBox="0 0 780 330" role="img" aria-label="Sample August cashflow Sankey: income flows to cash, then to expenses and savings">
      <path class="flow" stroke="#69a77c" stroke-width="78" d="M160 115 C285 115 300 145 370 145"/><path class="flow" stroke="#7b66a8" stroke-width="27" d="M160 225 C280 225 303 182 370 182"/>
      <path class="flow" stroke="#db8873" stroke-width="47" d="M420 143 C535 143 540 70 625 70"/><path class="flow" stroke="#e7a492" stroke-width="24" d="M420 164 C535 164 535 145 625 145"/><path class="flow" stroke="#e6b488" stroke-width="17" d="M420 180 C535 180 540 210 625 210"/><path class="flow" stroke="#8064ad" stroke-width="22" d="M420 195 C535 195 540 275 625 275"/>
      <rect class="node" x="45" y="76" width="115" height="78" fill="#cbe8d2"/><text class="label" x="57" y="108">Income</text><text class="amount" x="57" y="128">฿20,000</text>
      <rect class="node" x="45" y="198" width="115" height="54" fill="#e5dcf5"/><text class="label" x="57" y="220">Transfers</text><text class="amount" x="57" y="238">฿6,800</text>
      <rect class="node" x="370" y="120" width="50" height="95" fill="#dcebdd"/><text class="label" transform="translate(382 198) rotate(-90)">Cash</text>
      <rect class="node" x="625" y="45" width="125" height="54" fill="#f6d2c5"/><text class="label" x="637" y="67">Living</text><text class="amount" x="637" y="85">฿12,100</text>
      <rect class="node" x="625" y="121" width="125" height="47" fill="#fae1d8"/><text class="label" x="637" y="141">Food</text><text class="amount" x="637" y="157">฿6,100</text>
      <rect class="node" x="625" y="187" width="125" height="45" fill="#f8e5c9"/><text class="label" x="637" y="207">Travel</text><text class="amount" x="637" y="222">฿4,400</text>
      <rect class="node" x="625" y="251" width="125" height="50" fill="#e5dcf5"/><text class="label" x="637" y="273">Savings</text><text class="amount" x="637" y="290">฿4,200</text>
    </svg>`;
    const state = key => `<div class="state">PROTOTYPE STATE → variant=${key} · period=August 2026 · sample_data=true · income=฿20,000 · outgoing=฿22,600 · net=-฿2,600</div>`;
    const A = () => `<div class="eyebrow">Prototype · option A</div><h1>Cashflow at a glance</h1><p class="sub">Start with the decision: did money grow or shrink this month?</p><section class="a-metrics"><div class="metric"><small>Income</small><strong class="positive">฿20,000</strong></div><div class="metric"><small>Spent</small><strong class="negative">฿22,600</strong></div><div class="metric"><small>Saved</small><strong>฿4,200</strong></div><div class="metric"><small>Net cashflow</small><strong class="negative">−฿2,600</strong></div></section><section class="a-chart"><span class="pill">August 2026</span><h2>Where your cash went</h2>${chart()}<div class="key"><span><i class="dot" style="background:#69a77c"></i>Money in</span><span><i class="dot" style="background:#db8873"></i>Spent</span><span><i class="dot" style="background:#8064ad"></i>Moved to savings</span></div></section>${state('A')}`;
    const B = () => `<div class="eyebrow">Prototype · option B</div><div class="b-layout"><aside class="sidebar"><span class="pill">August 2026</span><h2>Cash account</h2><div class="budget"><small>Started with</small><b>฿8,900</b></div><div class="budget"><small>Money in</small><b>+฿26,800</b></div><div class="budget"><small>Money out</small><b>−฿26,800</b></div><div class="budget"><small>Ends with</small><b>฿8,900</b></div></aside><section class="b-chart"><h1>Follow every baht</h1><p class="sub">Income and account transfers flow through cash before they become spending or savings.</p>${chart()}<p class="sub">Best when transfers between your accounts matter as much as expenses.</p></section></div>${state('B')}`;
    const C = () => `<div class="eyebrow">Prototype · option C</div><div class="c-top"><div><span class="pill">August 2026</span><h1>Cashflow journal</h1></div><div><small>Net cashflow</small><strong class="negative">−฿2,600</strong></div></div><section class="c-board"><div class="c-chart"><h2>Money flow</h2>${chart(true)}</div><aside class="feed"><h3>Biggest moves</h3><div><span>Rent<small>Living</small></span><b>−฿7,500</b></div><div><span>Mom<small>Income</small></span><b class="positive">+฿20,000</b></div><div><span>Emergency fund<small>Savings</small></span><b>−฿4,200</b></div><div><span>Vietnam travel<small>Travel</small></span><b>−฿4,400</b></div><p class="sub">Use this version to understand the story behind the month.</p></aside></section>${state('C')}`;
    const renders = {A,B,C}; let current = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase(); if (!renders[current]) current='A';
    function render(){ document.getElementById('app').innerHTML=renders[current](); const found=variants.find(([key])=>key===current); document.getElementById('variant-label').textContent=`${found[0]} — ${found[1]}`; history.replaceState({},'',`?variant=${current}`); }
    function move(delta){ current=variants[(variants.findIndex(([key])=>key===current)+delta+variants.length)%variants.length][0]; render(); }
    document.getElementById('prev').onclick=()=>move(-1); document.getElementById('next').onclick=()=>move(1); window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)}); render();
  </script>
</body>
</html>
