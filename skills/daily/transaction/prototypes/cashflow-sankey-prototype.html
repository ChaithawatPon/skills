<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cashflow Dashboard — Sanitized Prototype</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172018;background:#f6f7f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:36px 24px 90px}header{display:flex;justify-content:space-between;gap:16px;align-items:start}h1{font-size:36px;letter-spacing:-.05em;margin:5px 0 22px}h2{letter-spacing:-.035em;margin:0}.eyebrow,.context{margin:0;color:#397a57;font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.prototype{padding:8px 11px;border-radius:999px;background:#fff3cf;color:#805d10;font-size:11px;font-weight:850}.tabs{display:flex;border-bottom:1px solid #dfe4d9}.tab{padding:11px 14px;border:0;border-radius:9px 9px 0 0;background:#e8f1e9;color:#246b48;font-weight:800}.toolbar{display:grid;grid-template-columns:max-content minmax(260px,360px);gap:14px;align-items:end;margin:20px 0 12px}.switch{display:flex;gap:4px;padding:4px;border:1px solid #d8e0d5;border-radius:14px;background:#edf1eb}.switch button,.ranges button{border:0;cursor:pointer;font-weight:800}.switch button{padding:11px 16px;border-radius:10px;background:transparent;color:#617066}.switch button.active{background:#246b48;color:white}.period{display:grid;gap:6px;color:#536054;font-size:12px;font-weight:800}.period input,.period select{min-height:46px;padding:9px 13px;border:2px solid #cfd9cd;border-radius:12px;background:#fff;font:inherit;font-weight:750}.range-context{width:fit-content;padding:5px 9px;border-radius:7px;background:#e8f1e9;color:#246b48}.ranges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.ranges button{padding:9px 13px;border:1px solid #d8e0d5;border-radius:999px;background:#fff;color:#617066}.ranges button.active{border-color:#246b48;background:#e8f1e9;color:#246b48}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.metric{background:#fff;border:1px solid #dfe4d9;border-radius:18px;box-shadow:0 16px 50px #18351a0c}.metric{padding:17px}.metric small{display:block;color:#69736b;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10px}.metric strong{display:block;margin-top:4px;font-size:24px;letter-spacing:-.04em}.positive{color:#24784d}.negative{color:#bd5848}.card{padding:20px}.chart-scroll{overflow-x:auto}.sankey{display:block;width:100%;min-width:720px;height:auto}.node-title{font-size:15px;font-weight:850;fill:#172018}.node-value{font-size:12px;font-weight:700;fill:#617065}.flow{fill:none;stroke-linecap:round;opacity:.58}.trend-toggle{margin:16px 0 0;padding:10px 14px;border:0;border-radius:10px;background:#e8f1e9;color:#246b48;font-weight:850;cursor:pointer}.trend{margin-top:12px}.trend[hidden]{display:none}.legend{display:flex;gap:16px;color:#69756d;font-size:12px;font-weight:750}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px}.line{width:100%;height:auto}.transactions{margin-top:16px}.table-wrap{overflow:auto;margin-top:12px;border:1px solid #edf1eb;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #edf1eb;text-align:left}th{background:#f4f6f1;color:#536054}.state{margin-top:16px;padding:10px 12px;border:1px dashed #cbd6c8;border-radius:10px;color:#657168;font:12px ui-monospace,monospace}
    @media(max-width:760px){.shell{padding:24px 14px 70px}header{display:block}h1{font-size:30px}.prototype{display:inline-block;margin-bottom:12px}.toolbar{grid-template-columns:1fr}.switch button{flex:1}.switch{width:100%}.period input,.period select{width:100%}.ranges{display:grid;grid-template-columns:repeat(3,1fr)}.ranges button{padding-inline:6px}.metrics{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.sankey{min-width:680px}.metric strong{font-size:21px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">Sample cashflow</p><h1>Cashflow at a glance</h1></div><span class="prototype">SANITIZED PROTOTYPE · FAKE DATA</span></header>
    <nav class="tabs" aria-label="Prototype pages"><button class="tab" type="button">Cashflow</button></nav>
    <section class="toolbar">
      <div class="switch" role="group" aria-label="Cashflow period"><button class="view active" data-view="month" type="button">▦ Month</button><button class="view" data-view="year" type="button">▣ Year</button></div>
      <label class="period" id="month-control">Select month<input id="month" type="month" value="2026-08"><span id="range-context" class="range-context"></span></label>
      <label class="period" id="year-control" hidden>Select year<select id="year"><option>2026</option><option>2025</option></select></label>
    </section>
    <div class="ranges" role="group" aria-label="Rolling period"><button class="range active" data-months="1">1 month</button><button class="range" data-months="3">3 months</button><button class="range" data-months="6">6 months</button></div>
    <section class="metrics"><article class="metric"><small>Income</small><strong id="income" class="positive">฿0</strong></article><article class="metric"><small>Spent</small><strong id="spent" class="negative">฿0</strong></article><article class="metric"><small>Saved / moved</small><strong id="saved">฿0</strong></article><article class="metric"><small>Net cashflow</small><strong id="net">฿0</strong></article></section>
    <article class="card"><div class="chart-scroll"><svg class="sankey" viewBox="0 0 900 500" role="img" aria-label="Synthetic cashflow Sankey chart">
      <path class="flow" d="M214 155 C320 155 300 250 388 250" stroke="#74ad88" stroke-width="44"/><path class="flow" d="M214 345 C320 345 300 286 388 286" stroke="#8976bc" stroke-width="22"/>
      <path class="flow" d="M512 268 C610 268 600 72 686 72" stroke="#e5a08e" stroke-width="38"/><path class="flow" d="M512 268 C610 268 600 180 686 180" stroke="#efb4a7" stroke-width="29"/><path class="flow" d="M512 268 C610 268 600 288 686 288" stroke="#f1c58f" stroke-width="24"/><path class="flow" d="M512 268 C610 268 600 396 686 396" stroke="#a292cf" stroke-width="20"/>
      <g><rect x="60" y="119" width="154" height="72" rx="12" fill="#dcebe1"/><text class="node-title" x="76" y="150">Income</text><text class="node-value" x="76" y="173">฿26,500</text></g>
      <g><rect x="60" y="309" width="154" height="72" rx="12" fill="#e7e2f3"/><text class="node-title" x="76" y="340">Transfers</text><text class="node-value" x="76" y="363">฿6,800</text></g>
      <g><rect x="388" y="232" width="124" height="72" rx="12" fill="#dcebdc"/><text class="node-title" x="404" y="263">Cash</text><text class="node-value" x="404" y="286">฿33,300</text></g>
      <g><rect x="686" y="36" width="154" height="72" rx="12" fill="#f7dfd8"/><text class="node-title" x="702" y="67">Category 1</text><text class="node-value" x="702" y="90">฿8,200</text></g>
      <g><rect x="686" y="144" width="154" height="72" rx="12" fill="#f8e2dc"/><text class="node-title" x="702" y="175">Category 2</text><text class="node-value" x="702" y="198">฿6,100</text></g>
      <g><rect x="686" y="252" width="154" height="72" rx="12" fill="#faead6"/><text class="node-title" x="702" y="283">Category 3</text><text class="node-value" x="702" y="306">฿5,000</text></g>
      <g><rect x="686" y="360" width="154" height="72" rx="12" fill="#e6e1f4"/><text class="node-title" x="702" y="391">Account 2</text><text class="node-value" x="702" y="414">฿4,200</text></g>
    </svg></div><small>Sample updated 30/08/2026</small></article>
    <button id="trend-toggle" class="trend-toggle" type="button" aria-expanded="false">Show cashflow trend</button>
    <article id="trend" class="card trend" hidden><p class="context">Cashflow trend</p><h2 id="trend-title">Daily cashflow</h2><div class="legend"><span><i style="background:#24784d"></i>Income</span><span><i style="background:#bd5848"></i>Spent</span><span><i style="background:#8976bc"></i>Net flow</span></div><svg class="line" viewBox="0 0 900 260"><path d="M60 180 L220 100 L380 150 L540 70 L700 130 L840 55" fill="none" stroke="#24784d" stroke-width="4"/><path d="M60 205 L220 170 L380 120 L540 165 L700 90 L840 140" fill="none" stroke="#bd5848" stroke-width="4"/><path d="M60 190 L220 130 L380 170 L540 105 L700 155 L840 95" fill="none" stroke="#8976bc" stroke-width="3" stroke-dasharray="7 7"/></svg></article>
    <article class="card transactions"><p class="context">Synthetic ledger</p><h2>All transactions</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div></article>
    <div id="state" class="state"></div>
  </main>
  <script>
    const sampleTransactions=[
      {date:'2026-08-27',type:'Income',category:'Income Source 1',note:'Sample entry',amount:20000},{date:'2026-08-18',type:'Transfer',category:'Account 1',note:'Sample transfer',amount:6800},{date:'2026-08-12',type:'Expense',category:'Category 1',note:'Sample entry',amount:8200},{date:'2026-07-22',type:'Income',category:'Income Source 2',note:'Sample entry',amount:6500},{date:'2026-07-14',type:'Expense',category:'Category 2',note:'Sample entry',amount:6100},{date:'2026-06-09',type:'Expense',category:'Category 3',note:'Sample entry',amount:5000},{date:'2026-05-03',type:'Transfer',category:'Account 2',note:'Sample transfer',amount:-4200},{date:'2026-03-11',type:'Expense',category:'Category 1',note:'Sample entry',amount:3400}
    ];
    let view='month',months=1;const month=document.querySelector('#month'),year=document.querySelector('#year'),ranges=document.querySelector('.ranges'),money=value=>`฿${Math.abs(value).toLocaleString()}`;
    const span=()=>{const[y,m]=month.value.split('-').map(Number),end=new Date(y,m-1,1),start=new Date(y,m-months,1),format=d=>d.toLocaleString('en-GB',{month:'short',year:'numeric'});return months===1?format(end):`${format(start)}–${format(end)}`};
    function render(){const[y,m]=month.value.split('-').map(Number),start=view==='year'?new Date(Number(year.value),0,1):new Date(y,m-months,1),end=view==='year'?new Date(Number(year.value),11,31):new Date(y,m,0),visible=sampleTransactions.filter(t=>{const d=new Date(`${t.date}T00:00:00`);return d>=start&&d<=end}),income=visible.filter(t=>t.type==='Income').reduce((s,t)=>s+t.amount,0),spent=visible.filter(t=>t.type==='Expense').reduce((s,t)=>s+Math.abs(t.amount),0),saved=visible.filter(t=>t.type==='Transfer'&&t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0),net=visible.reduce((s,t)=>s+(t.type==='Expense'?-Math.abs(t.amount):t.amount),0);document.querySelector('#income').textContent=money(income);document.querySelector('#spent').textContent=money(spent);document.querySelector('#saved').textContent=money(saved);const netNode=document.querySelector('#net');netNode.textContent=`${net<0?'−':''}${money(net)}`;netNode.className=net>=0?'positive':'negative';document.querySelector('#range-context').textContent=view==='month'&&months>1?`${months} months · ${span()}`:'';document.querySelector('#rows').innerHTML=visible.map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${t.category}</td><td>${t.note}</td><td class="${t.type==='Expense'||t.amount<0?'negative':'positive'}">${t.type==='Expense'||t.amount<0?'−':'+'}${money(t.amount)}</td></tr>`).join('');document.querySelector('#state').textContent=`PROTOTYPE STATE → sample_data=true · view=${view} · months=${months} · period=${view==='year'?year.value:span()} · rows=${visible.length}`;document.querySelector('#trend-title').textContent=view==='year'?'Monthly cashflow':months>1?`${months}-month cashflow`:'Daily cashflow'}
    document.querySelectorAll('.view').forEach(button=>button.onclick=()=>{view=button.dataset.view;months=1;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b===button));document.querySelector('#month-control').hidden=view==='year';document.querySelector('#year-control').hidden=view!=='year';ranges.hidden=view==='year';document.querySelectorAll('.range').forEach(b=>b.classList.toggle('active',Number(b.dataset.months)===1));render()});
    document.querySelectorAll('.range').forEach(button=>button.onclick=()=>{months=Number(button.dataset.months);document.querySelectorAll('.range').forEach(b=>b.classList.toggle('active',b===button));render()});month.onchange=render;year.onchange=render;document.querySelector('#trend-toggle').onclick=event=>{const trend=document.querySelector('#trend'),show=trend.hidden;trend.hidden=!show;event.currentTarget.textContent=show?'Hide cashflow trend':'Show cashflow trend';event.currentTarget.setAttribute('aria-expanded',String(show))};render();
  </script>
</body>
</html>
