name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/selling/sell-to-facebook-marketplace/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/validate.sh
      - run: python3 -m pip install -r skills/media/edit-video/requirements.txt
      - run: python3 skills/media/edit-video/scripts/test_fixture_smoke.py
      - run: npm ci
        working-directory: skills/selling/sell-to-facebook-marketplace
      - run: npm test
        working-directory: skills/selling/sell-to-facebook-marketplace
